name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gofest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gofest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gofest_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gofest_test?schema=public
      AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
      AUTH_REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-at-least-16
      EMAIL_PROVIDER: console
      EMAIL_FROM: Gofest <no-reply@gofest.local>
      STORAGE_PROVIDER: local
      STORAGE_DIR: ./storage
      WEB_URL: http://localhost:5173
      API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @gofest/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
